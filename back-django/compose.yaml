name: vibix-django
services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Exécuter make init}
      POSTGRES_USER: ${POSTGRES_USER:?Exécuter make init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécuter make init}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      target: development
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${WEB_PORT:-8010}:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  contacts-worker:
    build:
      context: .
      target: development
    command: ["python", "manage.py", "process_contact_notifications", "--loop"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
  reservations-worker:
    profiles: [reservations]
    build:
      context: .
      target: development
    command: ["python", "manage.py", "process_booking_notifications", "--loop"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-vibix-django_postgres_data}
    external: ${USE_EXISTING_VOLUMES:-false}
  media_data:
    name: ${MEDIA_VOLUME_NAME:-vibix-django_media_data}
    external: ${USE_EXISTING_VOLUMES:-false}
