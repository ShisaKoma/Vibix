<div class="article-gallery">{% if content.picture %}<figure><img src="{% url 'media:image' content.site_id content.picture_id %}" alt="{{ content.picture.alt_text }}" width="{{ content.picture.width }}" height="{{ content.picture.height }}" loading="lazy"><figcaption>{{ content.picture.title }}</figcaption></figure>{% endif %}{% for image in content.gallery.all %}<figure><img src="{% url 'media:image' content.site_id image.asset_id %}" alt="{{ image.asset.alt_text }}" width="{{ image.asset.width }}" height="{{ image.asset.height }}" loading="lazy"><figcaption>{{ image.asset.title }}</figcaption></figure>{% endfor %}</div>
