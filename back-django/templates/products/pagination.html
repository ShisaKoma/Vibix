{% if page.has_other_pages %}<nav class="form-actions" aria-label="Pagination"><span>Page {{ page.number }} sur {{ page.paginator.num_pages }} — {{ page.paginator.count }} résultat{{ page.paginator.count|pluralize }}</span>{% if page.has_previous %}<a href="?{{ query }}&amp;page={{ page.previous_page_number }}">Précédente</a>{% endif %}{% if page.has_next %}<a href="?{{ query }}&amp;page={{ page.next_page_number }}">Suivante</a>{% endif %}</nav>{% endif %}
