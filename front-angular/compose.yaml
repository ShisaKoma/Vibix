name: vibix-angular-poc
services:
  site:
    build: .
    ports:
      - "127.0.0.1:${POC_PORT:-8020}:8080"
    environment:
      SITE_ID: ${SITE_ID:-2}
      DATA_MODE: ${DATA_MODE:-api}
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8010}
      API_HOST_HEADER: ${API_HOST_HEADER:-localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
