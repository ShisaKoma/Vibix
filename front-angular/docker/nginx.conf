limit_req_zone $binary_remote_addr zone=contact_requests:10m rate=1r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ ^/api/v1/public/sites/[0-9]+/contacts/ {
        client_max_body_size 256k;
        limit_req zone=contact_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_pass ${API_UPSTREAM};
        # Preserve the browser origin for Django CSRF, validated by ALLOWED_HOSTS.
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "csrftoken=$cookie_csrftoken";
        proxy_set_header Authorization "";
        proxy_set_header X-Contacts-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }
    location /api/v1/public/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store";
    }
    location = /runtime-config.json { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
